description: >-
  FiscalNote is a policy intelligence platform that provides legislative, regulatory, and stakeholder data spanning
  Congress, all 50 U.S. states, and more than 100 countries. FiscalNote expanded its PolicyNote API to eliminate AI
  hallucinations in compliance workflows by providing primary-source verified policy data.
